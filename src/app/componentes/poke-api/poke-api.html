<div class="container py-5"> <div class="row justify-content-center"> <div class="col-md-8 col-lg-6">

  <div class="card shadow">
    <div class="card-body">

      <h2 class="text-center mb-4">
        Buscador de Pokémon
      </h2>

      <div class="input-group mb-4">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nombrePokemon"
          (keyup.enter)="buscarPokemon()"
          placeholder="Ej. pikachu"
        >

        <button
          class="btn btn-primary"
          type="button"
          (click)="buscarPokemon()">
          Buscar
        </button>
      </div>

      <div *ngIf="cargando" class="text-center">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Buscando Pokémon...</p>
      </div>

      <div *ngIf="error" class="alert alert-danger text-center">
        {{ error }}
      </div>

      <div *ngIf="pokemon && !cargando">

        <div class="text-center">
          <img
            [src]="pokemon.sprites.other['official-artwork'].front_default"
            [alt]="pokemon.name"
            class="img-fluid"
            style="max-height: 250px;"
          >
        </div>

        <h3 class="text-center text-capitalize">
          {{ pokemon.name }}
        </h3>

        <p class="text-center text-muted">
          Pokémon #{{ pokemon.id }}
        </p>

        <hr>

        <div class="row text-center">

          <div class="col-6 mb-3">
            <strong>Altura</strong>
            <p>{{ pokemon.height / 10 }} m</p>
          </div>

          <div class="col-6 mb-3">
            <strong>Peso</strong>
            <p>{{ pokemon.weight / 10 }} kg</p>
          </div>

          <div class="col-12 mb-3">
            <strong>Experiencia base</strong>
            <p>{{ pokemon.base_experience }}</p>
          </div>

        </div>

        <div class="mb-3">
          <strong>Tipo</strong>

          <div class="mt-2">
            <span
              *ngFor="let tipo of pokemon.types"
              class="badge bg-primary me-2 text-capitalize">
              {{ tipo.type.name }}
            </span>
          </div>
        </div>

        <div>
          <strong>Habilidades</strong>

          <div class="mt-2">
            <span
              *ngFor="let habilidad of pokemon.abilities"
              class="badge bg-secondary me-2 text-capitalize">
              {{ habilidad.ability.name }}
            </span>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>

</div> </div>
