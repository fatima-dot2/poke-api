<div class="container mt-5">

  <h1 class="text-center mb-4">
    Especies Pokémon
  </h1>

  <div class="row justify-content-center">

    <div class="col-md-6">

      <input
        type="text"
        class="form-control mb-3"
        [(ngModel)]="nombre"
        placeholder="Ejemplo: pikachu">

      <button
        class="btn btn-primary w-100"
        (click)="buscarEspecie()">

        Buscar especie

      </button>

    </div>

  </div>

  @if (especie) {

    <div class="row justify-content-center mt-5">

      <div class="col-md-8">

        <div class="card shadow">

          <div class="card-body">

            <h2 class="card-title text-primary">
              {{ especie.name | uppercase }}
            </h2>

            <p class="card-text">
              <strong>ID:</strong>
              {{ especie.id }}
            </p>

            <p class="card-text">
              <strong>Generación:</strong>
              {{ especie.generation.name }}
            </p>

            <p class="card-text">
              <strong>Hábitat:</strong>

              @if (especie.habitat) {
                {{ especie.habitat.name }}
              } @else {
                No disponible
              }

            </p>

            <p class="card-text">
              <strong>Color:</strong>
              {{ especie.color.name }}
            </p>

            <p class="card-text">
              <strong>Forma:</strong>
              {{ especie.shape.name }}
            </p>

          </div>

        </div>

      </div>

    </div>

  }

</div>
