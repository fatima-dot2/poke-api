<div class="container py-4">

  <div class="text-center mb-4">
    <h1 class="fw-bold">Evolución Pokémon</h1>

    <p class="text-muted">
      Consulta la cadena de evolución de cualquier Pokémon
    </p>
  </div>

  <div class="row justify-content-center mb-4">

    <div class="col-12 col-md-8 col-lg-6">

      <div class="input-group">

        <input
          type="text"
          class="form-control"
          placeholder="Ejemplo: charmander"
          [(ngModel)]="nombrePokemon"
          (keyup.enter)="buscarEvolucion()"
        >

        <button
          class="btn btn-primary"
          type="button"
          (click)="buscarEvolucion()"
          [disabled]="cargando"
        >

          <span
            *ngIf="cargando"
            class="spinner-border spinner-border-sm me-2"
          ></span>

          Buscar

        </button>

        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="limpiar()"
        >
          Limpiar
        </button>

      </div>

    </div>

  </div>

  <div class="text-center mb-4">

    <p class="text-muted">
      Ejemplos:
    </p>

    <button
      class="btn btn-sm btn-outline-primary me-2 mb-2"
      (click)="buscarEvolucion('bulbasaur')"
    >
      Bulbasaur
    </button>

    <button
      class="btn btn-sm btn-outline-primary me-2 mb-2"
      (click)="buscarEvolucion('charmander')"
    >
      Charmander
    </button>

    <button
      class="btn btn-sm btn-outline-primary me-2 mb-2"
      (click)="buscarEvolucion('squirtle')"
    >
      Squirtle
    </button>

    <button
      class="btn btn-sm btn-outline-primary me-2 mb-2"
      (click)="buscarEvolucion('eevee')"
    >
      Eevee
    </button>

    <button
      class="btn btn-sm btn-outline-primary mb-2"
      (click)="buscarEvolucion('pikachu')"
    >
      Pikachu
    </button>

  </div>

  <div
    *ngIf="error"
    class="alert alert-danger text-center"
  >
    {{ error }}
  </div>

  <div
    *ngIf="cargando"
    class="text-center py-5"
  >

    <div
      class="spinner-border text-primary"
      role="status"
    ></div>

    <p class="mt-3 text-muted">
      Consultando PokéAPI...
    </p>

  </div>

  <div
    *ngIf="evoluciones.length > 0 && !cargando"
    class="card shadow-sm border-0"
  >

    <div class="card-body">

      <h2 class="text-center fw-bold mb-4">
        Cadena de evolución
      </h2>

      <div class="row justify-content-center align-items-center g-3">

        <ng-container
          *ngFor="let evolucion of evoluciones; let ultimo = last"
        >

          <div class="col-12 col-md-3">

            <div class="card h-100 text-center border">

              <div class="card-body">

                <h4 class="fw-bold text-capitalize">
                  {{ evolucion.nombre }}
                </h4>

                <p
                  *ngIf="evolucion.nivel"
                  class="mb-2"
                >
                  <strong>Nivel:</strong>
                  {{ evolucion.nivel }}
                </p>

                <p
                  *ngIf="evolucion.item"
                  class="mb-2 text-capitalize"
                >
                  <strong>Objeto:</strong>
                  {{ evolucion.item }}
                </p>

                <span class="badge bg-primary text-capitalize">
                  {{ evolucion.trigger }}
                </span>

              </div>

            </div>

          </div>

          <div
            *ngIf="!ultimo"
            class="col-auto d-none d-md-block"
          >
            <span class="fs-3">
              →
            </span>
          </div>

        </ng-container>

      </div>

    </div>

  </div>

</div>
